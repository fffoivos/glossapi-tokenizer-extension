[package]
name = "bib_line_model"
version = "0.1.0"
edition = "2021"
description = "Greek bibliography LINE classifier — decision-equivalent Rust port of the heading_lexgate stack (CPT corpus cleaning)."

# Hot-path corpus operation (per project rule: Rust-by-default, one detector / many consumers).
# This is a port, not a reimplementation: the fitted parameters come from
# eval/sequence_models/export_line_model_artifacts.py and the contract is that the
# emitted line mask at threshold 0.9 matches the Python pipeline document-for-document.
# The CLI binary is the thin runner; Python is only an I/O driver around it.

[lib]
name = "bib_line_model"
path = "src/lib.rs"

[[bin]]
name = "bib_line_detect"
path = "src/main.rs"

[dependencies]
anyhow = "1"
once_cell = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
