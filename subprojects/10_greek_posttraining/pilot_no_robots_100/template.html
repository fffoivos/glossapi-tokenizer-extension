<header class="hd">
  <h1 class="brand">no_robots <span class="ar">→</span> <span class="gr">Ρομπότ</span></h1>
  <div class="dek">A 100-prompt pilot: classify each English prompt, translate it to Greek, then write the Greek answer natively &middot; both stages Claude&nbsp;Opus&nbsp;5, medium reasoning effort &middot; real output, every number measured</div>

<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const PR=JSON.parse(document.getElementById('prompts').textContent);
const R=DATA.rows,S=DATA.stats;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clsTag=c=>`<span class="cls c-${esc(c)}">${esc(c)}</span>`;
const by=(f)=>R.filter(f);
const find=p=>R.find(r=>r.id===p);

/* ---------- i. sample ---------- */
document.getElementById('p1').innerHTML=`
<h2>Why these five categories</h2>
<p class="lead">no_robots ships a <code>category</code> field with ten values. Five of them were chosen here because each one stresses a <b>different way translation can fail</b> — not because they are the biggest. Twenty rows each, drawn with a fixed seed from a complete pull of the training split.</p>
<div class="tw"><table>
<tr><th>Category</th><th class="n">In split</th><th class="n">Sampled</th><th>What it stresses</th></tr>
<tr><td><b>Generation</b></td><td class="n">4,302</td><td class="n">20</td><td>The biggest bucket and the most mixed: ordinary prose sits beside poems, rhyme and acrostics that cannot survive translation at all.</td></tr>
<tr><td><b>Open QA</b></td><td class="n">1,167</td><td class="n">20</td><td>Facts about real places and people. The trap is <i>over</i>-adaptation — a question about Aberdeen must stay about Aberdeen.</td></tr>
<tr><td><b>Chat</b></td><td class="n">785</td><td class="n">20</td><td>Persona chatbots. Every sampled row is multi-turn <b>and</b> carries a system prompt, so voice and address form must hold across turns.</td></tr>
<tr><td><b>Rewrite</b></td><td class="n">618</td><td class="n">20</td><td>Operations <i>on English text</i>. "Make this more formal" uses different machinery in Greek than in English.</td></tr>
<tr><td><b>Closed QA</b></td><td class="n">240</td><td class="n">20</td><td>Long source passage plus a question. The answer must stay consistent with the <i>translated</i> passage — which makes it self-checking.</td></tr>
</table></div>
<p class="note">Sample frame: the full <code>train</code> split pulled page by page from the datasets-server, 9,499 unique <code>prompt_id</code> values recovered of 9,500 (one row lost to a persistent server error on a single page, re-tried five times). Selection is <code>random.Random(20260823).sample()</code> over each category sorted by <code>prompt_id</code>, so the pick is reproducible.</p>

<h2>The category field is necessary, but it is not enough</h2>
<p>Category tells you what the <i>task</i> is. It does not tell you what the <i>translation</i> has to do, and inside a single category those can differ completely. Two rows both labelled <span class="cls c-LITERAL">Generation</span>:</p>
<div class="grid2">
  <div class="card"><h4>“Write an email to my daughter, Jenna”</h4><p>Jenna is a stand-in. Keeping her name English leaves the Greek reading like a dubbed film — this row wants <b>localisation</b>.</p></div>
  <div class="card"><h4>“Write about the 1971 Ford Pinto”</h4><p>The Pinto is the subject. Localising it destroys the task — this row wants the entity left <b>exactly alone</b>.</p></div>
</div>
<p>So stage 1 does not translate first. It <b>classifies first</b>, assigning one of eight translation classes plus hazard flags, and only then translates according to that class. The classes and what they came out as are in the next tab.</p>
<div class="stat">
  <div class="st"><div class="v">100</div><div class="l">prompts</div></div>
  <div class="st"><div class="v">${S.loc_n}</div><div class="l">localisation calls</div></div>
  <div class="st"><div class="v">${S.dev_n}</div><div class="l">recorded deviations</div></div>
  <div class="st"><div class="v">${S.sf_n}</div><div class="l">self-flagged for review</div></div>
</div>`;

/* ---------- ii. classifier ---------- */
const mat=S.matrix;
document.getElementById('p2').innerHTML=`
<h2>Eight classes, assigned before a word is translated</h2>
<p class="lead">Each class is a different instruction to the translator. The distribution is the first real result of the pilot: the five categories map onto the classes <b>unevenly and non-obviously</b>.</p>
<div class="tw"><table class="matrix">

function pane(r){
  const enT=[],elT=[];
  if(r.sys_en)enT.push(['system',r.sys_en]); if(r.sys_el)elT.push(['system',r.sys_el]);
  if(r.u_en.length){r.u_en.forEach((t,i)=>{enT.push(['user',t]);if(r.r_en[i])enT.push(['assistant',r.r_en[i]])});}
  else{enT.push(['prompt',r.p_en]);r.r_en.forEach(t=>enT.push(['assistant',t]))}
  if(r.u_el.length){r.u_el.forEach((t,i)=>{elT.push(['user',t]);if(r.r_el[i])elT.push(['assistant',r.r_el[i]])});}
  else{elT.push(['prompt',r.p_el]);r.r_el.forEach(t=>elT.push(['assistant',t]))}
  const cell=(t)=>t.map(([role,tx])=>`<div class="turn"><span class="role">${esc(role)}</span><div class="txt">${esc(tx)}</div></div>`).join('');
  return `<div class="pair"><div class="side en"><div class="sidehd">English source<button class="cp" type="button" data-cp="${esc(r.id)}" data-side="en">copy</button></div><div class="sidebody">${cell(enT)}</div></div>
  <div class="side el"><div class="sidehd">Greek output<button class="cp" type="button" data-cp="${esc(r.id)}" data-side="el">copy</button></div><div class="sidebody">${cell(elT)}</div></div></div>`;
}

/* ---- copy helpers: build plain text for a row, and put it on the clipboard ---- */
function turnsOf(r,lang){
  const t=[];
  if(lang==='en'){
    if(r.sys_en)t.push(['system',r.sys_en]);
    if(r.u_en.length)r.u_en.forEach((x,i)=>{t.push(['user',x]);if(r.r_en[i])t.push(['assistant',r.r_en[i]])});
    else{t.push(['prompt',r.p_en]);r.r_en.forEach(x=>t.push(['assistant',x]))}
  }else{
    if(r.sys_el)t.push(['system',r.sys_el]);
    if(r.u_el.length)r.u_el.forEach((x,i)=>{t.push(['user',x]);if(r.r_el[i])t.push(['assistant',r.r_el[i]])});
    else{t.push(['prompt',r.p_el]);r.r_el.forEach(x=>t.push(['assistant',x]))}
  }
  return t;
}
function rowText(r,side){
  const head=`[${r.id} · ${r.cat} · ${r.cls} · target ${r.reg_t}${r.reg_u?` · written ${r.reg_u}`:''}]`;
  const fmt=(lang)=>turnsOf(r,lang).map(([role,tx])=>`${role.toUpperCase()} (${lang}):\n${tx}`).join('\n\n');
  if(side==='en')return `${head}\n\n${fmt('en')}`;
  if(side==='el')return `${head}\n\n${fmt('el')}`;
  let s=`${head}\n\n--- ENGLISH SOURCE ---\n${fmt('en')}\n\n--- GREEK OUTPUT ---\n${fmt('el')}`;
  if(r.haz.length)s+=`\n\nhazards: ${r.haz.join(', ')}`;
  if(r.loc.length)s+=`\nlocalisation: ${r.loc.map(d=>`${d.en} -> ${d.el}`).join(' | ')}`;
  if(r.tn)s+=`\ntranslator notes: ${r.tn}`;
  if(r.dev.length)s+=`\ndeviations: ${r.dev.join(' | ')}`;
  if(r.sf.length)s+=`\nflagged: ${r.sf.join(' | ')}`;
  if(r.flags.length||r.adv.length)s+=`\ngates: ${[...r.flags,...r.adv].join(', ')||'clean'}`;
  return s;
}
function copyText(txt,btn){
  const done=()=>{if(!btn)return;const o=btn.textContent;btn.textContent='copied ✓';btn.classList.add('done');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1300)};
  const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=txt;
    ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();
  }catch(e){if(btn){btn.textContent='press ⌘C';setTimeout(()=>{btn.textContent='copy'},1600)}}};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  }else fallback();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cp]');
  if(b){e.stopPropagation();const r=find(b.dataset.cp);if(r)copyText(rowText(r,b.dataset.side||'all'),b);return;}
  const id=e.target.closest('.rid');
  if(id){e.stopPropagation();copyText(id.dataset.id||id.textContent.trim(),id);}
});
function exBlock(id,title,why){
  const r=find(id); if(!r)return '';
  return `<section class="ex"><div class="exhd"><h3>${esc(title)}</h3>${clsTag(r.cls)}<span class="meta">${esc(r.cat)} · <span class="rid" data-id="${esc(r.id)}" title="copy this row id">${esc(r.id)}</span> · ${esc(r.reg_t)}</span></div>
  <div class="why">${why}</div>${pane(r)}
  ${r.loc.length?`<div class="vfix"><div class="vh"><span class="vv">localisation calls</span></div><div class="vb"><ul class="tight">${r.loc.map(d=>`<li><b>${esc(d.en)}</b> → <b>${esc(d.el)}</b> — ${esc(d.why)}</li>`).join('')}</ul></div></div>`:''}
  ${r.sn?`<div class="vfix"><div class="vh"><span class="vv">substitution note</span></div><div class="vb">${esc(r.sn)}</div></div>`:''}
  ${r.sf.length?`<div class="vfix"><div class="vh"><span class="vv">flagged by the model for a human</span></div><div class="vb"><ul class="tight">${r.sf.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
  </section>`;
}

        ${r.tn?`<dt>notes</dt><dd>${esc(r.tn)}</dd>`:''}
        <dt>measured</dt><dd>Greek ratio ${r.gr} · length vs English ${r.lr==null?'—':r.lr}× · markers read as ${esc(r.rd)}</dd>
      </dl>
      <div class="rowacts"><button class="cp" type="button" data-cp="${esc(r.id)}" data-side="all">copy whole row</button></div>
      ${pane(r)}
      ${r.loc.length?`<div class="vfix"><div class="vh"><span class="vv">localisation calls</span></div><div class="vb"><ul class="tight">${r.loc.map(d=>`<li><b>${esc(d.en)}</b> → <b>${esc(d.el)}</b> — ${esc(d.why)}</li>`).join('')}</ul></div></div>`:''}
      ${r.sn?`<div class="vfix"><div class="vh"><span class="vv">substitution</span></div><div class="vb">${esc(r.sn)}</div></div>`:''}
      ${r.dev.length?`<div class="vfix"><div class="vh"><span class="vv">deviations from the English answer</span></div><div class="vb"><ul class="tight">${r.dev.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
      ${r.sf.length?`<div class="vfix"><div class="vh"><span class="vv">flagged for a human</span></div><div class="vb"><ul class="tight">${r.sf.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`:''}
    </div></div>`).join('');
}
list.addEventListener('click',e=>{
  /* copy targets are handled by the document-level listener; don't also toggle the row */
  if(e.target.closest('[data-cp]')||e.target.closest('.rid'))return;
  const b=e.target.closest('.rowhd');if(!b)return;
  const row=b.parentElement,open=row.classList.toggle('open');b.setAttribute('aria-expanded',open?'true':'false');});
['fc','fk','ff'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{render();saveState()}));
document.getElementById('fq').addEventListener('input',()=>{render();saveState()});
document.querySelectorAll('.catb').forEach(b=>b.addEventListener('click',()=>{
  document.getElementById('fc').value=b.dataset.cat;render();saveState();}));
const fx=document.getElementById('fx');
fx.addEventListener('click',()=>{expanded=!expanded;fx.textContent=expanded?'Collapse all':'Expand all';
  fx.setAttribute('aria-pressed',expanded?'true':'false');render();saveState();});
/* initial render happens in the restore block below, once saved filters are applied */

/* ---- reading position, durable across reloads ----
   A republish reloads the page, so in-memory state alone loses the reader's place.
   Persist tab + per-tab scroll + filter state; restore on load. Storage may be
   unavailable in a sandboxed frame, so every access is guarded. */
const KEY='nr-el-pilot-v1';
let scrollPos={},curTab='1';
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');
  if(s&&typeof s==='object'){scrollPos=s.scrollPos||{};curTab=s.tab||'1';return s}}catch(e){}return {}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify({
  tab:curTab,scrollPos,expanded,
  f:{c:document.getElementById('fc').value,k:document.getElementById('fk').value,
     s:document.getElementById('ff').value,q:document.getElementById('fq').value}}))}catch(e){}}
function showTab(n,restore){
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===n?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='p'+n));
  curTab=n;
  if(restore!==false)requestAnimationFrame(()=>window.scrollTo({top:scrollPos[n]||0,behavior:'instant'}));
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  scrollPos[curTab]=window.scrollY||document.documentElement.scrollTop||0;
  showTab(t.dataset.t); saveState();
}));
let sTimer=null;
window.addEventListener('scroll',()=>{clearTimeout(sTimer);
  sTimer=setTimeout(()=>{scrollPos[curTab]=window.scrollY||document.documentElement.scrollTop||0;saveState()},220)},{passive:true});
window.addEventListener('pagehide',()=>{scrollPos[curTab]=window.scrollY||0;saveState()});

/* restore the previous session's place */
(function(){
  const s=loadState();
  if(s.f){const g=id=>document.getElementById(id);
    if(s.f.c!=null)g('fc').value=s.f.c; if(s.f.k!=null)g('fk').value=s.f.k;
    if(s.f.s!=null)g('ff').value=s.f.s; if(s.f.q!=null)g('fq').value=s.f.q;}
  if(typeof s.expanded==='boolean'){expanded=s.expanded;
    fx.textContent=expanded?'Collapse all':'Expand all';fx.setAttribute('aria-pressed',String(expanded));}
  render();
  showTab(curTab);
})();
</script>
